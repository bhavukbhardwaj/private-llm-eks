# In-cluster load test (assignment requirement): a pod sends REQUESTS chat completions at CONCURRENCY through the internal ALB and prints
# throughput, p50/p95 latency and errors as JSON. Runs on a system (arm64) node. Placeholders are filled in by k8s/bootstrap.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest
  namespace: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: system
      containers:
        - name: loadtest
          image: ${ECR}/loadtest:v1
          args:
            - --url=${TARGET_URL}
            - --model=${MODEL_NAME}
            - --requests=${REQUESTS}
            - --concurrency=${CONCURRENCY}
            - --max-tokens=128
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
