# Placeholder web app behind an internal ALB: proves the Load Balancer Controller, IRSA-free image pulls from ECR
# and the in-VPC path before the GPU work. ${ECR} is filled in by k8s/bootstrap.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeholder
  template:
    metadata:
      labels:
        app: placeholder
    spec:
      containers:
        - name: web
          image: ${ECR}/busybox:1.38.0
          command: ["sh", "-c", "mkdir -p /www && echo 'placeholder ok' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: placeholder
  namespace: demo
spec:
  selector:
    app: placeholder
  ports:
    - port: 80
      targetPort: 8080
---
# Internal ALB (scheme internal, target-type ip), reachable only from inside the VPC.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placeholder
  namespace: demo
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: 10.20.0.0/16
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: placeholder
                port:
                  number: 80
